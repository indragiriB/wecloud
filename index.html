<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>We Cloud: Jasa Website dan Aplikasi, Solo</title>
    <meta
      name="description"
      content="We Cloud dari Solo membuat website dan aplikasi untuk bisnis, komunitas, dan organisasi. Lihat proyek pilihan, layanan, dan cara menghubungi kami."
    />
    <meta property="og:title" content="We Cloud: Jasa Website dan Aplikasi, Solo" />
    <meta property="og:description" content="Website dan aplikasi yang cepat, rapi, dan mudah dipakai. Dari Solo untuk seluruh Indonesia." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta name="theme-color" content="#e9e9e6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Geist + Geist Mono. To self-host instead, see the README. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved / system theme before first paint to avoid a flash. -->
    <script>
      try {
        var t =
          localStorage.getItem('theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
